# Configure, build and install the bundle on both platforms.
#
# The install step is the point. The bundle is consumed through FetchContent
# and only ever installed by the consumer's packaging, so an install rule that
# names a file wrongly is invisible to every build and fatal to every package
# -- `ImCoolbar.h` for a file called `ImCoolBar.h` went unnoticed until the
# first Linux install tree was produced, because Windows does not care about
# the case. Installing here, on a filesystem that does, is what catches the
# next one.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install
        run: cmake --install build --config Release --prefix ${{ github.workspace }}/prefix

      - name: Every header the bundle declares is installed
        shell: bash
        run: |
          test -f prefix/include/imgui_bundle/imgui.h
          test -f prefix/include/imgui_bundle/ImCoolBar.h
          ls prefix/include/imgui_bundle | wc -l
